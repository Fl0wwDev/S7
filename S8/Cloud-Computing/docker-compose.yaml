version: '3.8'

services:
  app:
    build: .             
    ports:
      - "8080:8080"      
    depends_on:
      - db               

  db:
    image: mysql
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: "todo"
    volumes:
      - mysql-data:/var/lib/mysql  

volumes:
  mysql-data: